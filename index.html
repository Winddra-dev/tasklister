<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wellister ✨</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FDFBF7;
            --card: #FFFFFF;
            --text-main: #4A4A4A;
            --text-muted: #94A3B8;
            --border: #F1F5F9;
        }
        .dark {
            --bg: #18161F;
            --card: #23202E;
            --text-main: #F3E8FF;
            --text-muted: #9CA3AF;
            --border: #2E293D;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            transition: background-color .3s, color .3s;
        }
        .custom-card {
            background-color: var(--card);
            border-color: var(--border);
        }
        .pastel-yellow { background-color: #FEF3C7; color: #B45309; }
        .pastel-mint { background-color: #D1FAE5; color: #047857; }
        .pastel-pink { background-color: #FCE7F3; color: #BE185D; }
        .dark .pastel-yellow { background-color: #423011; color: #FCD34D; }
        .dark .pastel-mint { background-color: #11382A; color: #6EE7B7; }
        .dark .pastel-pink { background-color: #4A1D35; color: #F472B6; }
    </style>
</head>
<body class="pb-28">

    <!-- Header & Alarm Realita (Teguran Mood) -->
    <header class="pt-8 pb-6 px-6 custom-card shadow-sm rounded-b-[30px] mb-6 border-b">
        <div class="max-w-md mx-auto flex justify-between items-start">
            <div>
                <h1 class="text-2xl font-bold">Wellister ✨</h1>
                <p id="reality-alarm" class="text-xs font-semibold mt-2 bg-rose-500/10 text-rose-500 dark:text-rose-400 p-3 rounded-2xl border border-rose-500/20 hidden">
                    🔥 <!-- Teks teguran dinamis muncul di sini -->
                </p>
                <p id="quote-box" class="text-xs opacity-60 mt-2 italic">"Pelan-pelan asal jalan, yang penting tugas kelar!"</p>
            </div>
            <button onclick="toggleDarkMode()" class="custom-card border p-2.5 rounded-2xl text-base shadow-sm" id="theme-btn" title="Ganti Tema">🌙</button>
        </div>
    </header>

    <!-- Konten Utama: List Tugas -->
    <main class="max-w-md mx-auto px-4">
        <div id="task-list" class="space-y-4">
            <!-- Tugas dinamis dimuat di sini -->
        </div>

        <!-- State Kosong -->
        <div id="empty-state" class="text-center py-16 hidden">
            <div class="text-4xl mb-2">🎉</div>
            <p class="opacity-50 font-medium text-sm">Wah, tugasmu kosong! Santai dulu bro.</p>
        </div>
    </main>

    <!-- Tombol Tambah Tugas Mengambang (FAB) -->
    <div class="fixed bottom-6 left-0 right-0 flex justify-center z-20 px-4">
        <button onclick="openModal()" class="w-full max-w-md bg-indigo-400 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-full shadow-lg flex items-center justify-center gap-2 transition-transform active:scale-95 text-sm">
            <span class="text-lg">+</span> Tambah Tugas Baru
        </button>
    </div>

    <!-- Modal Input Tugas -->
    <div id="task-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="custom-card w-full max-w-md rounded-t-[30px] sm:rounded-[30px] p-6 max-h-[90vh] overflow-y-auto shadow-2xl border">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-bold">📝 Bikin Tugas Baru</h2>
                <button onclick="closeModal()" class="opacity-60 hover:opacity-100 font-bold text-lg">✕</button>
            </div>

            <form id="task-form" onsubmit="saveTask(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block font-bold opacity-70 uppercase tracking-wider mb-1">Mata Pelajaran (Mapel)</label>
                    <input type="text" id="task-mapel" required class="w-full bg-black/5 dark:bg-white/5 border border-current/10 rounded-2xl px-4 py-2.5 text-xs focus:outline-none focus:border-indigo-400" placeholder="Contoh: Matematika, Sejarah, PPLG">
                </div>

                <div>
                    <label class="block font-bold opacity-70 uppercase tracking-wider mb-1">Judul Tugas</label>
                    <input type="text" id="task-title" required class="w-full bg-black/5 dark:bg-white/5 border border-current/10 rounded-2xl px-4 py-2.5 text-xs focus:outline-none focus:border-indigo-400" placeholder="Contoh: Bikin Laporan Praktikum">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold opacity-70 uppercase tracking-wider mb-1">Tipe Pengerjaan</label>
                        <select id="task-type" class="w-full bg-black/5 dark:bg-white/5 border border-current/10 rounded-2xl px-3 py-2.5 text-xs focus:outline-none focus:border-indigo-400">
                            <option value="Individu">👤 Individu</option>
                            <option value="Kelompok">👥 Kelompok</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold opacity-70 uppercase tracking-wider mb-1">Bentuk Tugas</label>
                        <select id="task-category" class="w-full bg-black/5 dark:bg-white/5 border border-current/10 rounded-2xl px-3 py-2.5 text-xs focus:outline-none focus:border-indigo-400">
                            <option value="Presentasi/PPT">📊 Presentasi / PPT</option>
                            <option value="Makalah/Laporan">📑 Makalah / Laporan</option>
                            <option value="Praktik/Produk">🛠️ Praktik / Produk</option>
                            <option value="Nulis/Catatan">✍️ Nulis / Catatan</option>
                            <option value="Lainnya">📌 Lainnya</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block font-bold opacity-70 uppercase tracking-wider mb-1">Tenggat Waktu (Deadline)</label>
                    <input type="date" id="task-deadline" required class="w-full bg-black/5 dark:bg-white/5 border border-current/10 rounded-2xl px-4 py-2.5 text-xs focus:outline-none focus:border-indigo-400">
                </div>

                <!-- Bagian Komponen Beban Kerja -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="font-bold opacity-70 uppercase tracking-wider">Komponen Beban Kerja</label>
                        <button type="button" onclick="addWorkloadItem()" class="text-indigo-400 font-bold hover:underline">+ Tambah Bagian</button>
                    </div>
                    <div id="workload-container" class="space-y-2">
                        <div class="flex gap-2 items-center workload-row">
                            <input type="text" placeholder="Misal: Cari referensi" required class="flex-1 bg-black/5 dark:bg-white/5 border border-current/10 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-400 w-name">
                            <select class="bg-black/5 dark:bg-white/5 border border-current/10 rounded-xl px-2 py-2 text-xs focus:outline-none focus:border-indigo-400 w-score">
                                <option value="1">1 (Ringan)</option>
                                <option value="2">2 (Sedang)</option>
                                <option value="3" selected>3 (Normal)</option>
                                <option value="4">4 (Berat)</option>
                                <option value="5">5 (Ekstrem)</option>
                            </select>
                            <button type="button" onclick="removeWorkloadItem(this)" class="opacity-40 hover:text-rose-400 px-1">✕</button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-indigo-400 hover:bg-indigo-500 text-white font-bold py-3 rounded-2xl shadow-md transition-transform active:scale-95 mt-4">Simpan Tugas</button>
            </form>
        </div>
    </div>

    <!-- Script Logika & Data -->
    <script>
        let tasks = JSON.parse(localStorage.getItem('playful_tasks_v2')) || [];

        // Atur Tema Dark/Light awal
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
            document.getElementById('theme-btn').innerText = '🌙';
        } else {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-btn').innerText = '☀️';
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-btn').innerText = isDark ? '☀️' : '🌙';
        }

        // Quotes santai
        const quotes = [
            "\"Pelan-pelan asal jalan, yang penting tugas kelar!\"",
            "\"Dikerjain sekarang = santai nanti malam. Deal?\"",
            "\"Tarik napas, cicil dikit-dikit pasti beres kok.\"",
            "\"Jangan biarkan tugas numpuk kayak cucian piring!\""
        ];
        document.getElementById('quote-box').innerText = quotes[Math.floor(Math.random() * quotes.length)];

        // Set minimal date input ke hari ini
        document.getElementById('task-deadline').min = new Date().toISOString().split("T")[0];

        function openModal() {
            document.getElementById('task-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('task-modal').classList.add('hidden');
            document.getElementById('task-form').reset();
            document.getElementById('workload-container').innerHTML = `
                <div class="flex gap-2 items-center workload-row">
                    <input type="text" placeholder="Misal: Cari referensi" required class="flex-1 bg-black/5 dark:bg-white/5 border border-current/10 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-400 w-name">
                    <select class="bg-black/5 dark:bg-white/5 border border-current/10 rounded-xl px-2 py-2 text-xs focus:outline-none focus:border-indigo-400 w-score">
                        <option value="1">1 (Ringan)</option><option value="2">2 (Sedang)</option><option value="3" selected>3 (Normal)</option><option value="4">4 (Berat)</option><option value="5">5 (Ekstrem)</option>
                    </select>
                    <button type="button" onclick="removeWorkloadItem(this)" class="opacity-40 hover:text-rose-400 px-1">✕</button>
                </div>
            `;
        }

        function addWorkloadItem() {
            const container = document.getElementById('workload-container');
            const row = document.createElement('div');
            row.className = "flex gap-2 items-center workload-row";
            row.innerHTML = `
                <input type="text" placeholder="Bagian tugas..." required class="flex-1 bg-black/5 dark:bg-white/5 border border-current/10 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-indigo-400 w-name">
                <select class="bg-black/5 dark:bg-white/5 border border-current/10 rounded-xl px-2 py-2 text-xs focus:outline-none focus:border-indigo-400 w-score">
                    <option value="1">1 (Ringan)</option><option value="2">2 (Sedang)</option><option value="3" selected>3 (Normal)</option><option value="4">4 (Berat)</option><option value="5">5 (Ekstrem)</option>
                </select>
                <button type="button" onclick="removeWorkloadItem(this)" class="opacity-40 hover:text-rose-400 px-1">✕</button>
            `;
            container.appendChild(row);
        }

        function removeWorkloadItem(btn) {
            const rows = document.querySelectorAll('.workload-row');
            if(rows.length > 1) {
                btn.parentElement.remove();
            }
        }

        function saveTask(e) {
            e.preventDefault();
            const mapel = document.getElementById('task-mapel').value;
            const title = document.getElementById('task-title').value;
            const type = document.getElementById('task-type').value;
            const category = document.getElementById('task-category').value;
            const deadline = document.getElementById('task-deadline').value;

            const rows = document.querySelectorAll('.workload-row');
            let totalLoad = 0;
            let items = [];

            rows.forEach(row => {
                const name = row.querySelector('.w-name').value;
                const score = parseInt(row.querySelector('.w-score').value);
                totalLoad += score;
                items.push({ name, score });
            });

            const newTask = {
                id: Date.now(),
                mapel,
                title,
                type,
                category,
                deadline,
                totalLoad,
                items,
                completed: false
            };

            tasks.push(newTask);
            localStorage.setItem('playful_tasks_v2', JSON.stringify(tasks));
            closeModal();
            renderTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? {...t, completed: !t.completed} : t);
            localStorage.setItem('playful_tasks_v2', JSON.stringify(tasks));
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            localStorage.setItem('playful_tasks_v2', JSON.stringify(tasks));
            renderTasks();
        }

        function renderTasks() {
            const listEl = document.getElementById('task-list');
            const emptyEl = document.getElementById('empty-state');
            const alarmEl = document.getElementById('reality-alarm');
            listEl.innerHTML = '';

            if (tasks.length === 0) {
                emptyEl.classList.remove('hidden');
                alarmEl.classList.add('hidden');
                return;
            } else {
                emptyEl.classList.add('hidden');
            }

            const today = new Date();
            today.setHours(0,0,0,0);

            let urgentCount = 0;
            tasks.forEach(t => {
                if(!t.completed) {
                    const diff = Math.ceil((new Date(t.deadline) - today) / (1000 * 60 * 60 * 24));
                    if(diff <= 1) urgentCount++;
                }
            });

            if(urgentCount > 0) {
                alarmEl.classList.remove('hidden');
                alarmEl.innerText = `🚨 Eh, ada ${urgentCount} tugas yang tenggatnya udah mepet banget! Masih mau males-malesan atau dicicil sekarang nih?`;
            } else {
                alarmEl.classList.add('hidden');
            }

            const sortedTasks = [...tasks].sort((a, b) => {
                if (a.completed !== b.completed) return a.completed ? 1 : -1;

                const dateA = new Date(a.deadline);
                const dateB = new Date(b.deadline);
                const diffDaysA = Math.max(1, Math.ceil((dateA - today) / (1000 * 60 * 60 * 24)));
                const diffDaysB = Math.max(1, Math.ceil((dateB - today) / (1000 * 60 * 60 * 24)));

                const scoreA = a.totalLoad / diffDaysA;
                const scoreB = b.totalLoad / diffDaysB;

                return scoreB - scoreA;
            });

            sortedTasks.forEach(task => {
                let badgeClass = "pastel-yellow";
                let badgeText = "Chill 🌿";
                if(task.totalLoad >= 6 && task.totalLoad <= 10) {
                    badgeClass = "pastel-mint";
                    badgeText = "Lumayan 🏃‍♂️";
                } else if(task.totalLoad > 10) {
                    badgeClass = "pastel-pink";
                    badgeText = "Keteteran 🔥";
                }

                const card = document.createElement('div');
                card.className = `custom-card border rounded-[24px] p-5 shadow-sm transition-all text-xs ${task.completed ? 'opacity-50' : ''}`;
                
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="bg-indigo-500/10 text-indigo-400 font-bold px-2.5 py-1 rounded-lg">${task.mapel}</span>
                        <div class="flex gap-1.5 opacity-75">
                            <span class="bg-black/5 dark:bg-white/5 px-2 py-0.5 rounded-md">${task.type === 'Kelompok' ? '👥 Kelompok' : '👤 Individu'}</span>
                            <span class="bg-black/5 dark:bg-white/5 px-2 py-0.5 rounded-md">${task.category}</span>
                        </div>
                    </div>

                    <div class="flex items-start justify-between gap-3 mt-3">
                        <div class="flex items-start gap-3 flex-1">
                            <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask(${task.id})" class="mt-1 w-5 h-5 accent-indigo-400 rounded-lg cursor-pointer">
                            <div>
                                <h3 class="font-bold text-sm sm:text-base ${task.completed ? 'line-through opacity-50' : ''}">${task.title}</h3>
                                <p class="opacity-50 mt-0.5">📅 Deadline: ${task.deadline}</p>
                            </div>
                        </div>
                        <span class="font-bold px-2.5 py-1 rounded-full text-[10px] ${badgeClass}">${badgeText} (${task.totalLoad})</span>
                    </div>

                    <div class="mt-3 pl-8 space-y-1 border-t border-current/5 pt-2">
                        ${task.items.map(i => `<div class="opacity-60 flex justify-between"><span>• ${i.name}</span><span class="opacity-50">skor: ${i.score}</span></div>`).join('')}
                    </div>

                    <div class="mt-4 pt-3 border-t border-current/5 flex justify-between items-center text-[11px]">
                        <span class="opacity-40">ID: ${task.id}</span>
                        <button onclick="deleteTask(${task.id})" class="text-rose-400 hover:text-rose-600 font-medium">Hapus</button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        renderTasks();
    </script>
</body>
</html>
